<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reminder — Timetabs</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    main { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); }
    main > * { min-width: 0; }
    h1 { font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
    .meta { margin: 0; color: var(--subtext); overflow-wrap: anywhere; }
    .when { margin: 0; font-weight: 600; }
    .when.late { color: var(--p1); }
    .actions { display: flex; gap: var(--space-2); }
    .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
    .items li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions button { display: inline-flex; align-items: center; gap: var(--space-2); }
  </style>
</head>
<body>
  <main>
    <h1 id="title" role="alert">Reminder</h1>
    <p id="meta" class="meta"></p>
    <p id="when" class="when"></p>
    <ul id="items" class="items" hidden></ul>
    <div class="actions">
      <button id="go" class="primary" type="button" autofocus>Go to tab <kbd>↵</kbd></button>
      <button id="snooze" type="button"><span id="snooze-label">Snooze</span> <kbd>S</kbd></button>
      <button id="done" type="button">Done <kbd>D</kbd></button>
    </div>
  </main>
  <script src="../shared.js"></script>
  <script src="alert.js"></script>
</body>
</html>
